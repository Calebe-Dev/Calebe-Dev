name: CI - Build & Test

# O deploy é feito pelo Cloudflare Pages (integração com o GitHub), que builda a main
# automaticamente. Este workflow só valida o código em push e PR.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run SvelteKit Checks (Type checking & Linting)
        run: npm run check

      - name: Build Application
        run: npm run build
